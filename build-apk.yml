name: Build Android APK

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags: ["v*"]

env:
  CACHE_VERSION: v2         # bump this (v3, v4...) to force a completely clean build

jobs:
  apk:
    runs-on: ubuntu-22.04   # pinned: newer images dropped packages Buildozer needs
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "Cython==0.29.37" virtualenv

      # python-for-android's own pip step breaks on Android-specific wheels from PyPI, so the
      # pure-Python dependencies are bundled into ./vendor instead and shipped with the app.
      - name: Bundle pure-Python dependencies
        run: |
          pip install --no-compile --no-deps --target vendor \
            --no-binary charset-normalizer,markupsafe \
            flask werkzeug jinja2 markupsafe itsdangerous click blinker \
            requests urllib3 idna charset-normalizer certifi \
            beautifulsoup4 soupsieve typing_extensions yt-dlp

      # Saved even when the build FAILS (see the save step), so a re-run resumes where it stopped.
      - name: Restore Buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ env.CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ env.CACHE_VERSION }}-

      # Reusing a cached copy of these generated folders can leave a half-upgraded pip behind.
      # They are rebuilt in seconds; the slow compiled parts (Python, Kivy, SDL) stay cached.
      - name: Clear stale python-for-android state
        run: |
          P=.buildozer/android/platform/build-arm64-v8a
          rm -rf "$P/build/venv" "$P/build/python-installs" "$P/dists"

      - name: Build APK
        run: buildozer -v android debug

      - name: Save Buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ env.CACHE_VERSION }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: VideoScraper-apk
          path: bin/*.apk
