name: Build Windows exe

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags: ["v*"]            # or push a tag like v1.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Download ffmpeg (bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item ffmpeg_tmp\*\bin\ffmpeg.exe .
          Copy-Item ffmpeg_tmp\*\bin\ffprobe.exe .

      - name: Build exe
        run: >
          pyinstaller --onefile --name VideoScraper
          --collect-all yt_dlp
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: VideoScraper-windows
          path: dist/VideoScraper.exe
