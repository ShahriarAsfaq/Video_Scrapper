name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CACHE_VERSION: v1

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "Cython==0.29.37" virtualenv

      - name: Restore Buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ env.CACHE_VERSION }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ env.CACHE_VERSION }}-${{ hashFiles('buildozer.spec') }}-

      - name: Build APK
        env:
          PIP_NO_BINARY: "charset-normalizer,markupsafe"
        run: buildozer -v android debug

      - name: Save Buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ env.CACHE_VERSION }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: VideoScraper-apk
          path: bin/*.apk
